<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phant Studio — Logo Design Portfolio</title>
<style>
:root{--ink:#14171f;--muted:#667085;--bg:#f4f5f7}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
header{max-width:1180px;margin:0 auto;padding:56px 24px 24px}h1{font-size:40px;margin:0 0 8px;letter-spacing:-.5px}
header p{color:var(--muted);font-size:17px;max-width:720px;line-height:1.55;margin:0}
main{max-width:1180px;margin:0 auto;padding:16px 24px 64px;display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:22px}
.card{margin:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 1px 2px rgba(16,24,40,.06),0 6px 18px rgba(16,24,40,.06)}
.card img{display:block;width:100%;height:auto;aspect-ratio:5/4;background:#fff}
figcaption{padding:14px 18px 18px;border-top:1px solid #eef0f3}figcaption b{font-size:16px}
figcaption span{float:right;font-size:13px;color:var(--muted);background:#f2f4f7;border-radius:99px;padding:2px 10px}
figcaption p{margin:8px 0 0;color:var(--muted);font-size:14px;line-height:1.45}
footer{max-width:1180px;margin:0 auto;padding:0 24px 48px;color:var(--muted);font-size:14px}
</style></head><body>
<header><h1>Phant Studio</h1><p>Logo &amp; brand identity design. Selected concept work for fictional brands — each mark is built as clean vector artwork and delivered as EPS, PDF, SVG and PNG (Illustrator-compatible) with colour, black and reversed versions.</p></header>
<main><figure class="card"><img src="logos/01-ember-roast.png" alt="Ember Roast logo concept" loading="lazy"><figcaption><b>Ember Roast</b><span>Coffee roastery</span><p>Rising sun + coffee bean; warm retro horizon lines.</p></figcaption></figure><figure class="card"><img src="logos/02-nodewise.png" alt="Nodewise logo concept" loading="lazy"><figcaption><b>Nodewise</b><span>Data platform</span><p>Connected-node hexagon for a data integration startup.</p></figcaption></figure><figure class="card"><img src="logos/03-still.png" alt="Still logo concept" loading="lazy"><figcaption><b>Still</b><span>Yoga studio</span><p>Layered lotus petals over a calm water line.</p></figcaption></figure><figure class="card"><img src="logos/04-greenline.png" alt="Greenline logo concept" loading="lazy"><figcaption><b>Greenline</b><span>Landscaping</span><p>Tree and rolling hills, bold horizontal lockup.</p></figcaption></figure><figure class="card"><img src="logos/05-golden-crumb.png" alt="Golden Crumb logo concept" loading="lazy"><figcaption><b>Golden Crumb</b><span>Artisan bakery</span><p>Wheat stalk inside a bakery stamp ring.</p></figcaption></figure><figure class="card"><img src="logos/06-bright-dental.png" alt="Bright Dental logo concept" loading="lazy"><figcaption><b>Bright Dental</b><span>Dental clinic</span><p>Friendly tooth mark with a fresh leaf accent.</p></figcaption></figure><figure class="card"><img src="logos/07-harbor--hale.png" alt="Harbor &amp; Hale logo concept" loading="lazy"><figcaption><b>Harbor &amp; Hale</b><span>Wealth advisors</span><p>Classic serif monogram for a private advisory firm.</p></figcaption></figure><figure class="card"><img src="logos/08-peak-freight.png" alt="Peak Freight logo concept" loading="lazy"><figcaption><b>Peak Freight</b><span>Logistics</span><p>Mountain peaks with a forward-moving freight arrow.</p></figcaption></figure><figure class="card"><img src="logos/09-lumen.png" alt="Lumen logo concept" loading="lazy"><figcaption><b>Lumen</b><span>Optometry</span><p>Concentric lens rings with a light highlight.</p></figcaption></figure><figure class="card"><img src="logos/10-little-sprout.png" alt="Little Sprout logo concept" loading="lazy"><figcaption><b>Little Sprout</b><span>Early learning</span><p>Open book sprouting new leaves.</p></figcaption></figure><figure class="card"><img src="logos/11-atlas-build-co.png" alt="Atlas Build Co. logo concept" loading="lazy"><figcaption><b>Atlas Build Co.</b><span>Construction</span><p>A-frame monogram with a structural beam.</p></figcaption></figure><figure class="card"><img src="logos/12-solace.png" alt="Solace logo concept" loading="lazy"><figcaption><b>Solace</b><span>Skincare</span><p>Soft droplet with a negative-space leaf.</p></figcaption></figure></main>
<footer>Phant Studio · Melbourne, Australia</footer>
</body></html>
